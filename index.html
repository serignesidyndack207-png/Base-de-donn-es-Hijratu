<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daara Al Hijratu Lil Amali Wal Khidmati</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <img src="images/logo.png" alt="Logo Dahira" class="logo">

        <h1>Bienvenu au Daara Al Hijratu Lil Amali Wal Khidmati</h1>

        <p class="subtitle">Merci de remplir ce formulaire</p>

        <form id="memberForm">

            <div class="form-group">
                <label for="idcarte">Numéro carte membre</label>
                <input type="text" id="idcarte" required>
            </div>

            <div class="form-group">
                <label for="nomprenom">Nom et Prénoms</label>
                <input type="text" id="nomprenom" required>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <button type="submit">Enregistrer</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
